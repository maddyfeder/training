<style>
  :root{
    --ground:#14181D;
    --surface:#1C222A;
    --raised:#252D37;
    --line:#333D49;
    --ink:#E9EEF3;
    --muted:#8B98A6;
    --dim:#5E6B7A;

    /* Olympic plate colour code — the real one */
    --plate-red:#D2453C;    /* 25kg — peak weeks */
    --plate-blue:#3C7AD2;   /* 20kg — build weeks */
    --plate-green:#4AA96C;  /* 10kg — de-load weeks */
    --plate-yellow:#E3B23C; /* 15kg — test + reset */

    --sans:'IBM Plex Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.5;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
  input{font-family:var(--mono);color:var(--ink)}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:20;background:var(--ground);
    border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 0 0;
  }
  .hrow{display:flex;align-items:baseline;gap:10px;padding:0 16px 8px}
  .wknum{
    font-family:var(--disp);font-size:30px;font-weight:700;
    letter-spacing:.02em;line-height:1;
  }
  .blocktag{
    font-family:var(--mono);font-size:10px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;
    padding:3px 7px;border-radius:2px;color:var(--ground);
  }
  .phasetag{
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);margin-left:auto
  }

  /* ---------- SIGNATURE: the plate strip ---------- */
  .strip{
    display:flex;gap:2px;padding:0 16px 10px;
    overflow-x:auto;scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .seg{
    flex:0 0 auto;width:11px;height:26px;border-radius:1px;
    opacity:.34;position:relative;transition:opacity .18s,transform .18s;
  }
  .seg.on{opacity:1}
  .seg.cur{transform:scaleY(1.28);opacity:1}
  .seg.cur::after{
    content:'';position:absolute;left:50%;bottom:-6px;width:3px;height:3px;
    background:var(--ink);border-radius:50%;transform:translateX(-50%);
  }
  .seg.past{opacity:.62}

  /* ---------- layout ---------- */
  main{padding:18px 16px 28px;max-width:560px;margin:0 auto}
  .eyebrow{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--dim);
    display:flex;align-items:center;gap:10px;margin:26px 0 10px;
  }
  .eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}
  .eyebrow:first-child{margin-top:0}

  /* ---------- today hero ---------- */
  .hero{
    background:var(--surface);border:1px solid var(--line);
    border-radius:4px;overflow:hidden;
  }
  .hero-top{
    display:flex;align-items:center;gap:10px;
    padding:13px 15px;border-bottom:1px solid var(--line);
  }
  .chip{
    font-family:var(--disp);font-size:17px;font-weight:700;
    width:27px;height:27px;flex:0 0 27px;border-radius:2px;
    display:grid;place-items:center;color:var(--ground);line-height:1;
  }
  .hero-when{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .today-pip{
    margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:600;
    letter-spacing:.14em;padding:3px 7px;border:1px solid var(--plate-yellow);

  /* ---------- day rows ---------- */

  :focus-visible{outline:2px solid var(--plate-blue);outline-offset:2px}

<main id="main"><div class="load">Loading your block…</div></main>

<script>
/* ============================================================
   PLAN DATA — mirrors the spreadsheet exactly
   ============================================================ */
const START = new Date(2026, 7, 17);          // Mon 17 Aug 2026
const DAYS  = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

// phase, split, [[sets,reps,rpe] x4], z2%, long%, swim%
const BLOCKS = [
  ['1','Foundation','Lower / Push / Pull',
   [[3,'8–12','6–7'],[3,'8–12','7'],[4,'8–12','7–8'],[2,'10–12','5–6']],
   [1.00,1.10,1.20,0.70],[1.00,1.13,1.25,0.65],[1.00,1.07,1.13,0.70]],
  ['1','Foundation','Lower / Push / Pull',
   [[3,'8–12','7'],[4,'8–10','7–8'],[4,'8–10','8'],[2,'10–12','5–6']],
   [1.12,1.20,1.28,0.72],[1.20,1.33,1.45,0.70],[1.13,1.20,1.27,0.72]],
  ['2','Strength Build','Lower / Upper / Full',
   [[4,'6–10','7'],[4,'6–10','7–8'],[5,'6–8','8–8.5'],[2,'8–10','5–6']],
   [1.20,1.28,1.36,0.72],[1.30,1.45,1.58,0.70],[1.27,1.33,1.40,0.73]],
  ['2','Strength Build','Lower / Upper / Full',
   [[4,'6–8','7–8'],[4,'6–8','8'],[5,'5–8','8.5'],[2,'8–10','5–6']],
   [1.28,1.36,1.40,0.75],[1.40,1.53,1.68,0.72],[1.33,1.40,1.47,0.73]],
  ['3','Peak Strength','Lower / Upper / Full',
   [[4,'4–6','7–8'],[5,'4–6','8–8.5'],[5,'3–5','9'],[2,'6–8','5–6']],
   [1.28,1.36,1.40,0.75],[1.45,1.58,1.75,0.72],[1.33,1.40,1.47,0.73]],
  ['3','Peak Strength','Lower / Upper / Full',
   [[4,'4–6','8'],[5,'3–5','8.5'],[5,'3–5','9'],[2,'6–8','5–6']],
   [1.28,1.36,1.40,0.75],[1.48,1.63,1.83,0.72],[1.33,1.40,1.47,0.73]],
];

const KINDS = ['b1','b2','peak','deload'];
const KIND_LABEL = {b1:'Build 1',b2:'Build 2',peak:'Peak',deload:'De-load',test:'Test',reset:'Reset'};
const KIND_COLOR = {b1:'--plate-blue',b2:'--plate-blue',peak:'--plate-red',
                    deload:'--plate-green',test:'--plate-yellow',reset:'--plate-yellow'};
const PIL_BY_KIND = {b1:2,b2:2,peak:1,deload:3,test:1,reset:3};

const WEEKS = [];
BLOCKS.forEach((b,bi)=>{
  const [phase,phaseName,split,prog,z2,lng,sw] = b;
  for(let i=0;i<4;i++){
    const kind = KINDS[i];
    WEEKS.push({
      wk: bi*4 + i + 1, phase, phaseName, split, kind,
      sets: prog[i][0], reps: prog[i][1], rpe: prog[i][2],
      z2: z2[i], lng: lng[i], sw: sw[i],
      swims: (i===3 || phase==='3') ? 1 : 2,
      pil: PIL_BY_KIND[kind],
      note: i===2 ? 'Hardest week of the block. Nothing optional gets added.'
          : i===3 ? 'Half the sets at ~60–65% of peak load. This should feel almost too easy — that is the point.'
          : '',
    });
  }
});
WEEKS.push({wk:25,phase:'T',phaseName:'Test',split:'Test days only',kind:'test',
  sets:3,reps:'3RM',rpe:'9–10',z2:0.90,lng:0.88,sw:0.80,swims:1,pil:1,
  note:'Find your new numbers. Log every 3RM under Lifts.'});
WEEKS.push({wk:26,phase:'R',phaseName:'Reset',split:'2 × full body, light',kind:'reset',
  sets:2,reps:'8–10',rpe:'5',z2:0.72,lng:0.70,sw:0.70,swims:1,pil:3,
  note:'Move, do not train. Then restart Week 1 with your new numbers.'});

/* ============================================================
   DAY BUILDER
   ============================================================ */
const r50 = n => Math.round(n/50)*50;

function buildDays(w, base){
  const km   = p => Math.round(base.z2 * p);
  const kmL  = p => Math.round(base.lng * p);
  const swim = p => r50(base.swim * p);
  const sr   = `${w.sets} × ${w.reps} · RPE ${w.rpe}`;
  const z2t  = `${km(w.z2)} km · Zone 2, conversational`;
  const lngt = `${kmL(w.lng)} km`;
  const swt  = `${swim(w.sw)} m · technique focus`;
  const p1   = w.phase === '1';
  const dl   = w.kind === 'deload';
  const lift = dl ? '35–45 min' : '60–75 min';

  if(w.wk === 25) return [
    ['S','Strength','Test — Squat 3RM','Warm up thoroughly, then 2–3 attempt singles','60 min'],
    ['S','Strength','Test — Bench + Overhead Press 3RM','3RM each. No accessory work','60 min'],
    ['B','Bike + Pilates','Easy spin, then class 4:30pm',z2t,'50 + 50 min'],
    ['S','Strength','Test — Deadlift 3RM','3RM. Stop if form breaks — a missed lift teaches nothing','50 min'],
    ['W','Swim','Easy recovery swim',swt,'30 min'],
    ['B','Bike','Easy ride, no intervals',lngt,'2–2.5 hr'],
    ['R','Rest','Off','','']];

  if(w.wk === 26) return [
    ['S','Strength','Full body, very light','2 × 8–10 · RPE 5','40 min'],
    ['P','Pilates','Class 6:30pm','','50 min'],
    ['B','Bike + Pilates','Easy spin, then class 4:30pm',z2t,'45 + 50 min'],
    ['S','Strength + Swim + Pilates','Full body light, swim, class 6:30pm','2 × 8–10 · RPE 5','40 + 30 + 50 min'],
    ['R','Rest','Off','',''],
    ['B','Bike','Easy ride',lngt,'1.5–2 hr'],
    ['R','Rest','Off','','']];

  // Tuesday — third class only in 3-class weeks
  const tueName = p1 ? 'Push — bench + overhead press' : 'Upper — bench + pull-up';
  const tue = w.pil >= 3
    ? ['S','Strength + Pilates', tueName + ' (lift earlier), class 6:30pm', sr, lift+' + 50 min']
    : ['S','Strength', tueName, sr, lift];

  // Thursday — hinge lift, then pool gym
  const thuName = p1 ? 'Pull — row + hip thrust' : 'Full body — deadlift focus';
  const thu = w.pil >= 2
    ? ['S','Strength + Swim + Pilates', thuName + ' (lift earlier), swim, class 6:30pm',
       `${sr}  ·  ${swim(w.sw)} m swim`, lift+' + 30 + 50 min']
    : ['S','Strength + Swim', thuName + ', then easy swim at the pool gym',
       `${sr}  ·  ${swim(w.sw)} m swim`, lift+' + 30 min'];

  // Friday
  const fri = dl
    ? ['R','Rest','Off','','']
    : w.swims >= 2
      ? ['W','Swim','Easy recovery swim — or a 30 min spin, your call',`${r50(base.swim*w.sw*0.7)} m · easy`,'25–35 min']
      : ['W','Recovery','Easy 20–30 min spin, or a walk','Nothing that leaves a mark','20–30 min'];

  const sat = dl ? 'Easy ride, no intervals'
    : w.kind==='b1' ? 'Long steady ride'
    : w.kind==='b2' ? 'Long ride with 3–4 tempo efforts'
    : 'Intervals or long hard ride';

  return [
    ['S','Strength','Lower — squat focus', sr, lift],
    tue,
    ['B','Bike + Pilates','Zone 2 endurance (ride earlier), class 4:30pm', z2t, (dl?'45–60':'60–90')+' min + 50 min'],
    thu,
    fri,
    ['B','Bike', sat, lngt, dl?'1–1.5 hr':'2–3 hr'],
    ['R','Rest','Off — or a 20 min walk','',''],
  ];
}

const LIFTS = [
  {id:'squat', name:'Squat',          day:'Monday'},
  {id:'bench', name:'Bench Press',    day:'Tuesday'},
  {id:'dead',  name:'Deadlift',       day:'Thursday'},
  {id:'ohp',   name:'Overhead Press', day:'Tue / Test'},
];

/* ============================================================
   STATE + STORAGE
   ============================================================ */
const KEY = 'block-v1';
let S = { base:{z2:25,lng:40,swim:1500}, done:{}, lifts:{} };
let view = 'today', shownWeek = 1, saveTimer = null;

/* Storage works three ways so the app persists wherever it runs:
   inside Claude (window.storage), pinned to a home screen or in any
   browser (localStorage), and worst case in memory for the session. */
const hasClaude = typeof window.storage === 'object' && window.storage !== null;
let hasLocal = false;
try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); hasLocal = true; }catch(e){}

async function readRaw(){
  if(hasClaude){
    try{ const r = await window.storage.get(KEY); if(r && r.value) return r.value; }catch(e){}
  }
  if(hasLocal){
    try{ const v = localStorage.getItem(KEY); if(v) return v; }catch(e){}
  }
  return null;
}
async function writeRaw(str){
  let ok = false;
  if(hasClaude){
    try{ await window.storage.set(KEY, str); ok = true; }catch(e){}
  }
  if(hasLocal){
    try{ localStorage.setItem(KEY, str); ok = true; }catch(e){}
  }
  return ok;
}

async function load(){
  try{
    const raw = await readRaw();
    if(raw){
      const p = JSON.parse(raw);
      S = { base:{...S.base, ...(p.base||{})}, done:p.done||{}, lifts:p.lifts||{} };
    }
  }catch(e){ /* first run — defaults stand */ }
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ writeRaw(JSON.stringify(S)); }, 350);
}

/* Export / import, so six months of logs are never trapped in one place. */
function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'training-block-backup.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function importData(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const p = JSON.parse(fr.result);
      S = { base:{...S.base, ...(p.base||{})}, done:p.done||{}, lifts:p.lifts||{} };
      save(); render();
    }catch(e){ alert('That file could not be read as a backup.'); }
  };
  fr.readAsText(f);
}

/* ============================================================
   DATE HELPERS
   ============================================================ */
function dateOf(wk, di){
  const d = new Date(START);
  d.setDate(d.getDate() + (wk-1)*7 + di);
  return d;
}
const FMT = new Intl.DateTimeFormat('en-CA',{month:'short',day:'numeric'});
const fmt = d => FMT.format(d);

function currentPos(){
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.floor((now - START) / 86400000);
  if(diff < 0)   return {wk:1,  di:0, before:true};
  if(diff > 181) return {wk:26, di:6, after:true};
  return {wk: Math.floor(diff/7)+1, di: diff%7};
}

const cvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc  = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function weekDone(wk){
  const w = WEEKS[wk-1], ds = buildDays(w, S.base);
  let tot=0, hit=0;
  ds.forEach((d,i)=>{ if(d[0]!=='R'){ tot++; if(S.done[wk+'-'+i]) hit++; } });
  return {tot, hit};
}

/* ============================================================
   RENDER — header
   ============================================================ */
function renderHeader(){
  const w = WEEKS[shownWeek-1], pos = currentPos();
  const col = cvar(KIND_COLOR[w.kind]);
  const segs = WEEKS.map(x=>{
    const cls = ['seg'];
    if(x.wk === shownWeek) cls.push('cur');
    else if(x.wk < pos.wk) cls.push('past');
    else cls.push('on');
    return `<button class="${cls.join(' ')}" style="background:${cvar(KIND_COLOR[x.kind])}"
      onclick="goWeek(${x.wk})" aria-label="Week ${x.wk}, ${KIND_LABEL[x.kind]}"></button>`;
  }).join('');

  document.getElementById('hdr').innerHTML = `
    <div class="hrow">
      <span class="wknum">WK ${String(w.wk).padStart(2,'0')}</span>
      <span class="blocktag" style="background:${col}">${KIND_LABEL[w.kind]}</span>
      <span class="phasetag">${esc(w.phaseName)}</span>
    </div>
    <div class="strip" id="strip">${segs}</div>`;

  const cur = document.querySelector('.seg.cur');
  if(cur) cur.scrollIntoView({block:'nearest', inline:'center'});
}

/* ============================================================
   RENDER — today
   ============================================================ */
function renderToday(){
  const pos = currentPos();
  const w = WEEKS[pos.wk-1], ds = buildDays(w, S.base);
  const [tag, sess, focus, target, time] = ds[pos.di];
  const key = pos.wk+'-'+pos.di;
  const isDone = !!S.done[key];
  const col = cvar(KIND_COLOR[w.kind]);
  const d = dateOf(pos.wk, pos.di);

  let hero;
  if(tag === 'R'){
    hero = `<div class="hero"><div class="hero-top">
        <span class="chip" style="background:var(--dim)">R</span>
        <span class="hero-when">${DAYS[pos.di]} · ${fmt(d)}</span>
        <span class="today-pip">TODAY</span>
      </div>
      <div class="hero-body">
        <div class="hero-focus">Rest day. Nothing to log.</div>
        <div class="hero-time">${esc(focus)}</div>
      </div></div>`;
  } else {
    hero = `<div class="hero"><div class="hero-top">
        <span class="chip" style="background:${col}">${tag}</span>
        <span class="hero-when">${DAYS[pos.di]} · ${fmt(d)}</span>
        <span class="today-pip">TODAY</span>
      </div>
      <div class="hero-body">
        <div class="hero-sess">${esc(sess)}</div>
        <div class="hero-focus">${esc(focus)}</div>
        ${target ? `<div class="hero-target">${esc(target)}</div>` : ''}
        ${time ? `<div class="hero-time">${esc(time)}</div>` : ''}
        ${w.note ? `<div class="hero-note">${esc(w.note)}</div>` : ''}
        <button class="doit ${isDone?'done':''}" onclick="toggle('${key}')">
          ${isDone ? '✓ Done' : 'Mark done'}
        </button>
      </div></div>`;
  }

  const rest = ds.map((x,i)=>{
    if(i === pos.di) return '';
    return dayRow(pos.wk, i, x, false);
  }).join('');

  const p = weekDone(pos.wk);
  const banner = pos.before ? `<div class="callout"><b>Starts ${fmt(START)}.</b> Showing Week 1 Day 1 until then.</div>`
    : pos.after ? `<div class="callout"><b>Block complete.</b> Restart at Week 1 with your new numbers.</div>` : '';

  document.getElementById('main').innerHTML = `
    ${banner}
    ${hero}
    <div class="eyebrow">Rest of week ${pos.wk} · ${p.hit}/${p.tot}</div>
    ${rest}`;
}

function dayRow(wk, i, x, showCur){
  const [tag, sess, focus, target] = x;
  const key = wk+'-'+i;
  const w = WEEKS[wk-1];
  const col = tag==='R' ? cvar('--dim') : cvar(KIND_COLOR[w.kind]);
  const d = dateOf(wk, i);
  const pos = currentPos();
  const isCur = showCur && pos.wk===wk && pos.di===i;

  if(tag === 'R') return `<div class="day rest ${isCur?'cur':''}">
      <div class="day-d"><b>${DAYS[i]}</b>${fmt(d)}</div>
      <div class="day-main"><div class="day-sess">Rest</div></div>
      <div style="width:28px"></div></div>`;

  return `<div class="day ${isCur?'cur':''}">
      <div class="day-d"><b>${DAYS[i]}</b>${fmt(d)}</div>
      <div class="day-main">
        <div class="day-sess">${esc(focus)}</div>
        <div class="day-meta">${esc(target || sess)}</div>
      </div>
      <button class="tick ${S.done[key]?'done':''}" onclick="toggle('${key}')"
        aria-label="Mark ${DAYS[i]} done">✓</button>
    </div>`;
}

/* ============================================================
   RENDER — week
   ============================================================ */
function renderWeek(){
  const w = WEEKS[shownWeek-1], ds = buildDays(w, S.base);
  const bikeTot = Math.round(S.base.z2*w.z2) + Math.round(S.base.lng*w.lng);
  const p = weekDone(shownWeek);

  document.getElementById('main').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-n">${bikeTot}</div><div class="stat-l">km bike</div></div>
      <div class="stat"><div class="stat-n">${w.swims}</div><div class="stat-l">swims</div></div>
      <div class="stat"><div class="stat-n">${w.pil}</div><div class="stat-l">pilates</div></div>
      <div class="stat"><div class="stat-n">${p.hit}/${p.tot}</div><div class="stat-l">done</div></div>
    </div>

    <div class="eyebrow">${esc(w.split)} · ${w.sets} × ${esc(w.reps)} · RPE ${esc(w.rpe)}</div>
    ${ds.map((x,i)=>dayRow(shownWeek,i,x,true)).join('')}
    ${w.note ? `<div class="callout" style="margin-top:16px">${esc(w.note)}</div>` : ''}

    <div class="wknav">
      <button onclick="goWeek(${shownWeek-1})" ${shownWeek<=1?'disabled':''}>← Prev</button>
      <button onclick="goWeek(currentPos().wk)">This week</button>
      <button onclick="goWeek(${shownWeek+1})" ${shownWeek>=26?'disabled':''}>Next →</button>
    </div>`;
}

/* ============================================================
   RENDER — lifts
   ============================================================ */
function e1rm(kg, reps){ return kg * (1 + reps/30); }

function renderLifts(){
  const wk = shownWeek;
  const cur = S.lifts[wk] || {};

  const cards = LIFTS.map(L=>{
    const v = cur[L.id] || {};
    let out = `<span style="color:var(--dim)">Log a top set to see your estimate</span>`;
    if(v.kg && v.reps){
      const now = e1rm(+v.kg, +v.reps);
      let prev = null;
      for(let k=wk-1;k>=1;k--){
        const q = (S.lifts[k]||{})[L.id];
        if(q && q.kg && q.reps){ prev = e1rm(+q.kg,+q.reps); break; }
      }
      let d = '';
      if(prev){
        const diff = now - prev;
        const cls = diff > 0.05 ? 'up' : diff < -0.05 ? 'dn' : '';
        const sign = diff > 0 ? '+' : '';
        d = `<span class="delta ${cls}">${sign}${diff.toFixed(1)} kg</span>`;
      }
      out = `<span class="lift-1rm">${now.toFixed(1)}</span>
             <span>kg est. 1RM</span>${d}`;
    }
    return `<div class="lift">
      <div class="lift-h"><span class="lift-n">${L.name}</span><span class="lift-day">${L.day}</span></div>
      <div class="lift-in">
        <input type="number" inputmode="decimal" step="0.5" placeholder="kg"
          value="${v.kg ?? ''}" oninput="setLift(${wk},'${L.id}','kg',this.value)">
        <span class="lift-x">×</span>
        <input type="number" inputmode="numeric" step="1" placeholder="reps"
          value="${v.reps ?? ''}" oninput="setLift(${wk},'${L.id}','reps',this.value)">
      </div>
      <div class="lift-out">${out}</div>
    </div>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="eyebrow">Top sets · week ${wk}</div>
    ${cards}
    <div class="prose" style="margin-top:6px">
      <p>Enter the heaviest set you finished with good form. Estimated 1RM uses the
      Epley formula and compares against your most recent logged week.</p>
    </div>
    <div class="wknav">
      <button onclick="goWeek(${wk-1})" ${wk<=1?'disabled':''}>← Prev</button>
      <button onclick="goWeek(currentPos().wk)">This week</button>
      <button onclick="goWeek(${wk+1})" ${wk>=26?'disabled':''}>Next →</button>
    </div>`;
}

/* ============================================================
   RENDER — plan
   ============================================================ */
function renderPlan(){
  const pos = currentPos();
  const rows = WEEKS.map(w=>{
    const p = weekDone(w.wk);
    const bike = Math.round(S.base.z2*w.z2) + Math.round(S.base.lng*w.lng);
    return `<button class="wk ${w.wk===pos.wk?'cur':''}" onclick="goWeek(${w.wk});setView('week')">
      <span class="wk-bar" style="background:${cvar(KIND_COLOR[w.kind])}"></span>
      <span class="wk-n">${w.wk}</span>
      <span class="wk-main">
        <span class="wk-t">${KIND_LABEL[w.kind]} · ${esc(w.phaseName)}</span>
        <span class="wk-m">${fmt(dateOf(w.wk,0))} · ${bike} km · ${w.sets}×${esc(w.reps)} · ${w.pil} pilates</span>
      </span>
      <span class="wk-prog">${p.hit}/${p.tot}</span>
    </button>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div class="eyebrow">Your baselines</div>
    <div class="base">
      <div class="base-row">
        <span class="base-l">Midweek Zone 2 ride<span>Comfortable 60–75 min today</span></span>
        <input type="number" inputmode="numeric" value="${S.base.z2}" oninput="setBase('z2',this.value)">
      </div>
      <div class="base-row">
        <span class="base-l">Saturday long ride<span>Your normal weekend ride</span></span>
        <input type="number" inputmode="numeric" value="${S.base.lng}" oninput="setBase('lng',this.value)">
      </div>
      <div class="base-row">
        <span class="base-l">Swim session<span>Metres you finish without dread</span></span>
        <input type="number" inputmode="numeric" step="50" value="${S.base.swim}" oninput="setBase('swim',this.value)">
      </div>
    </div>
    <div class="prose" style="margin-top:10px">
      <p>Every distance in the plan scales from these three. Change them and all 26 weeks recalculate.</p>
    </div>

    <div class="eyebrow">Pilates classes</div>
    <div class="prose">
      <p><b>Wednesday 4:30pm</b> runs every week — the only slot with no lift competing for it. Defend this one.</p>
      <p><b>Thursday 6:30pm</b> (or 6:45) is at the pool gym, so swim and class are one trip. Build weeks only.</p>
      <p><b>Tuesday 6:30pm</b> joins in de-load weeks, when lifting volume halves and there is room for it.</p>
      <p><b>Friday</b> is deliberately not in the plan — treat it as a make-up slot for a Wednesday you missed.</p>
    </div>

    <div class="eyebrow">The rules</div>
    <div>
      ${[
        'De-load means cut volume, keep load moderate. Half the sets at 60–65% of peak weight — not lots of light reps.',
        'Week 3 of a block should be the only one that feels genuinely hard. If week 2 already does, de-load early.',
        'Never de-load lifting and cycling in different weeks. Recovery weeks are whole-body or they are not recovery.',
        'Progress the top set only. Add 2.5 kg upper / 5 kg lower per block when the last rep still had one in reserve.',
        'Warm-ups feeling heavy, waking unrefreshed, losing interest — any two together means de-load now.',
        'Do not move the hard ride earlier. Saturday hard, Sunday off, Monday squat is why the week is ordered this way.',
        'Lose a week to illness or travel? Repeat it rather than jumping ahead.',
      ].map((t,i)=>`<div class="rule"><i>${String(i+1).padStart(2,'0')}</i><span>${esc(t)}</span></div>`).join('')}
    </div>

    <div class="eyebrow">Worth knowing</div>
    <div class="callout">
      <b>Week 19 peaks over Christmas</b> (Dec 21–27), with the deadlift session on Christmas Eve.
      Swapping weeks 19 and 20 puts the de-load on the holiday and the peak in early January.
    </div>

    <div class="eyebrow">All 26 weeks</div>
    ${rows}

    <div class="eyebrow">Your data</div>
    <div class="prose">
      <p>Ticks and lift logs save to <b>${hasClaude && hasLocal ? 'this device and your Claude account' : hasClaude ? 'your Claude account' : hasLocal ? 'this device' : 'this session only'}</b>.
      Back them up before you change phones or clear your browser.</p>
    </div>
    <div class="wknav" style="margin-top:10px">
      <button onclick="exportData()">Save backup</button>
      <button onclick="document.getElementById('imp').click()">Load backup</button>
    </div>
    <input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(this)">

    <div class="prose" style="margin-top:20px;font-size:12px">
      <p>Not medical or coaching advice. If something hurts in a way that is sharp, one-sided,
      or getting worse week to week, see a physio before pushing another block.</p>
    </div>`;
}

/* ============================================================
   NAV + ACTIONS
   ============================================================ */
const TABS = [
  ['today','Today','M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5'],
  ['week','Week','M4 5h16M4 5v15h16V5M9 5v15M15 5v15M4 10h16M4 15h16'],
  ['lifts','Lifts','M4 9v6M20 9v6M6.5 7v10M17.5 7v10M6.5 12h11'],
  ['plan','Plan','M4 6h16M4 12h16M4 18h10'],
];

function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(([id,label,d])=>
    `<button class="${view===id?'on':''}" onclick="setView('${id}')">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>
      ${label}
    </button>`).join('');
}

function render(){
  renderHeader();
  renderNav();
  if(view==='today') renderToday();
  else if(view==='week') renderWeek();
  else if(view==='lifts') renderLifts();
  else renderPlan();
}

function setView(v){
  view = v;
  if(v==='today') shownWeek = currentPos().wk;
  render();
  window.scrollTo({top:0});
}
function goWeek(n){
  if(n<1||n>26) return;
  shownWeek = n;
  if(view==='today') view='week';
  render();
}
function toggle(key){
  if(S.done[key]) delete S.done[key]; else S.done[key] = 1;
  save(); render();
}
function setBase(k,v){
  const n = parseFloat(v);
  S.base[k] = isFinite(n) && n>0 ? n : S.base[k];
  save();
  clearTimeout(window._bt);
  window._bt = setTimeout(()=>{ if(view!=='plan') render(); }, 500);
}
function setLift(wk,id,field,v){
  S.lifts[wk] = S.lifts[wk] || {};
  S.lifts[wk][id] = S.lifts[wk][id] || {};
  const n = parseFloat(v);
  if(v==='' || !isFinite(n)) delete S.lifts[wk][id][field];
  else S.lifts[wk][id][field] = n;
  save();
  const card = document.querySelectorAll('.lift')[LIFTS.findIndex(L=>L.id===id)];
  if(card){
    const v2 = S.lifts[wk][id];
    const out = card.querySelector('.lift-out');
    if(v2.kg && v2.reps){
      const now = e1rm(+v2.kg,+v2.reps);
      let prev=null;
      for(let k=wk-1;k>=1;k--){
        const q=(S.lifts[k]||{})[id];
        if(q&&q.kg&&q.reps){ prev=e1rm(+q.kg,+q.reps); break; }
      }
      let d='';
      if(prev){
        const diff=now-prev;
        d=`<span class="delta ${diff>0.05?'up':diff<-0.05?'dn':''}">${diff>0?'+':''}${diff.toFixed(1)} kg</span>`;
      }
      out.innerHTML = `<span class="lift-1rm">${now.toFixed(1)}</span><span>kg est. 1RM</span>${d}`;
    } else {
      out.innerHTML = `<span style="color:var(--dim)">Log a top set to see your estimate</span>`;
    }
  }
}

(async function(){
  await load();
  shownWeek = currentPos().wk;
  render();
})();
</script>
